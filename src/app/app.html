<!-- app.html -->
<header style="padding: 1rem 2rem; background: #0f172a; border-bottom: 1px solid #1e293b;">
  <nav style="display: flex; gap: 1.5rem; align-items: center;">
    <a routerLink="/products" style="color: #cbd5e1; text-decoration: none;">Products</a>
    <a routerLink="/cart" style="color: #cbd5e1; text-decoration: none;">Cart</a>
    <a routerLink="/orders" style="color: #cbd5e1; text-decoration: none;">Orders</a>
    <a *ngIf="isAdmin" routerLink="/add-product" style="color: #cbd5e1; text-decoration: none;">Add Product</a>
    
    <div style="margin-left: auto; display: flex; align-items: center; gap: 1rem;">
      <!-- Greets with exact account name -->
      <a *ngIf="currentUser" routerLink="/profile" style="color: #38bdf8; text-decoration: none; font-weight: bold;">
        Hello, {{ currentUser.name }} 👋
      </a>

      <button (click)="logout()" style="color: #ef4444; background: none; border: none; cursor: pointer;">
        Logout
      </button>
    </div>
  </nav>
</header>

<router-outlet></router-outlet>
